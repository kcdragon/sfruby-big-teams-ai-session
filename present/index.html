<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Big Teams Deck</title>
  <link rel="stylesheet" href="presenter.css">
  <script type="module" src="presenter.js"></script>
</head>
<body>
  <div id="viewport"><div id="stage"></div></div>
  <div id="notes-view" hidden>
    <header><span id="notes-position"></span><span id="notes-clock"></span><span id="notes-timer"></span></header>
    <div id="notes-current"></div>
    <p id="notes-next"></p>
    <footer>Arrows move the deck. R resets the timer.</footer>
  </div>
  <p id="poll-status" hidden></p>
</body>
</html>
